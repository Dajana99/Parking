name: smartpark_app
description: SmartPark - Flutter klijent (vozac, operater, administrator).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP pozivi ka REST API-ju
  http: ^1.2.2
  # Stanje aplikacije (prijavljeni korisnik)
  provider: ^6.1.2
  # Bezbedno cuvanje JWT tokena
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
