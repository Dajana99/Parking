spring.application.name=smartpark-backend
server.port=8080

# Lokalni .env fajl (nije u gitu) se ucitava kao skup podesavanja.
# Primer vrednosti je u .env.example.
spring.config.import=optional:file:.env[.properties]

# Baza - PostgreSQL. Vrednosti dolaze iz promenljivih okruzenja / .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartpark}
spring.datasource.username=${DB_USER:smartpark}
spring.datasource.password=${DB_PASSWORD:}

# Semu prave iskljucivo Flyway migracije, Hibernate je samo proverava.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT - tajna MORA da bude Base64 string od bar 32 bajta (npr. openssl rand -base64 48).
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Odakle frontend sme da salje zahteve (Flutter web u razvoju radi na localhost sa nasumicnim portom).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Dodati u postojeci src/main/resources/application.properties (vrednosti su podrazumevane, mogu se menjati)

# Koliko minuta posle pocetka rezervacije vozac moze da stigne pre nego sto rezervacija istekne (FR-11)
smartpark.reservation.grace-minutes=15
# Najduze trajanje jedne rezervacije
smartpark.reservation.max-duration-hours=24
# Koliko dana unapred moze da se rezervise
smartpark.reservation.max-days-ahead=30
# Koliko cesto radi provera isteklih rezervacija (ms); za demo moze 10000
smartpark.reservation.check-interval-ms=60000
smartpark.reservation.initial-delay-ms=30000

# Sva vremena u bazi cuvaju se u UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
